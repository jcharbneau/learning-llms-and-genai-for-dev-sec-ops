name: Notebook Hygiene

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

jobs:
  notebook-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check notebook outputs are stripped
        run: python scripts/check_notebooks_clean.py

      - name: Run smoke tests
        run: python -m unittest tests/test_repo_smoke.py
